<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="style.css" />
    <title>Cw 1 dodatkowe</title>
  </head>
  <body>
    <div>
      <div id="ex1" class="ex">
        <h5>Ex1 - OnClick</h5>
        <button id="ex1_button">Click me</button>
        <div id="ex1_content"></div>
      </div>

      <div id="ex2" class="ex">
        <h5>Ex2 - Validation</h5>
        <input type="text" id="ex2_text" placeholder="phone number" />
        <div id="ex2_content"></div>
        <p>Wpisano <span id="ex2_text_counter">0</span> znaków</p>
      </div>

      <div id="ex3" class="ex">
        <h5>Ex3 - Drag&Drop</h5>
        <div>
          <div id="ex3_one">
            <div id="ex3_element">Content</div>
          </div>
          <div id="ex3_two"></div>
        </div>
      </div>

      <div id="ex6_element">
        <img src="./assets/jinx.jpg" alt="image" id="ex6_element_img" />
      </div>
      <div id="ex6_animate_button_wrapper">
        <button id="ex6_animate_button" class="button">Przesuń</button>
      </div>
    </div>

    <button id="ex4_button" class="button">Zmień tło</button>

    <div id="ex6">
      <span id="ex6_content">0</span>
      <button id="ex6_button" class="button">Start</button>
    </div>
    <script type="module" src="./dist/script.js"></script>
  </body>
</html>
